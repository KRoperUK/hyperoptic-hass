version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    ignore:
      # pytest-homeassistant-custom-component pins these exactly
      # (pytest==9.0.0, pytest-asyncio==1.3.0), so any bump is unresolvable.
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      # Its resolved version is Python-marker dependent in uv.lock
      # (<3.14.2 -> 0.13.316, >=3.14.2 -> 0.13.366): the existing
      # >=0.13.316,<0.14.0 range is therefore already satisfied, and
      # dependabot fails the whole run with
      # "dependency_file_content_not_changed" on every attempt.
      - dependency-name: "pytest-homeassistant-custom-component"
